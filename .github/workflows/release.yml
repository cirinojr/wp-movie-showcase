name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install and test PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer test:all

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, lint, and build assets
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --exit-code -- build

      - name: Build installable ZIP
        run: npm run zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wp-movie-showcase.zip --generate-notes --verify-tag
